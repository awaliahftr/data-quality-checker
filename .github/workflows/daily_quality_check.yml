name: Daily Data Quality Check

env:
  TODAY: $(date +'%Y-%m-%d')

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      
      - name: Generate today's data
        run: |
          python src/data_generator.py
      
      - name: Run quality check
        run: |
          python src/quality_checker.py
      
      - name: Send email alert if issues found
        if: success() && hashFiles('reports/alert_needed.txt') != ''
        uses: hilarion5/send-mail@v1
        with:
          smtp-server: smtp.gmail.com
          smtp-port: 465
          smtp-secure: true
          from-email: ${{ secrets.EMAIL_FROM }}
          to-email: ${{ secrets.EMAIL_TO }}
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "⚠️ Data Quality Alert - ${{ env.TODAY }}"
          body: |
            🚨 Data Quality Issues Detected!
            
            Issues found in today's data check.
            
            📄 Full report available at:
            ${{ github.server_url }}/${{ github.repository }}/actions
      
      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: data-quality-reports
          path: reports/
      
      - name: Upload cleaned data
        uses: actions/upload-artifact@v4
        with:
          name: cleaned-data
          path: data/clean/
